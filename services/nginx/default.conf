upstream processing_data {
    server web:5000;
}

server {
    listen 80;
    access_log /var/log/nginx/access.log;

    location / {
        proxy_pass http://processing_data;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Static files (CSS, JS, the background image) still come from gunicorn,
    # but nginx stamps them cacheable for a day so browsers stop revalidating
    # them on every page load.
    location /static/ {
        proxy_pass http://processing_data;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        expires 1d;
    }

}