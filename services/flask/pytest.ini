[pytest]
# Pytest configuration for PHR Flask application

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Minimum version
minversion = 7.0

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes

# Markers for categorizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    database: marks tests that require database connection
    routes: marks tests for route testing
    forms: marks tests for form validation

# Test output
console_output_style = progress

# Coverage options (if using pytest-cov)
# addopts = --cov=website --cov-report=html --cov-report=term

# Ignore certain warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
