{% extends "base.html" %}
{% block title %}Passwords{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="text-center mb-4">Password Generator</h1>
            <div class="card p-4 shadow-sm" style="background-color: #f8f9fa; border-radius: 15px;">
                <div class="form-group mb-4">
                    <label for="generatedPassword" class="form-label text-muted">Generated Password</label>
                    <div class="input-group">
                        <input type="text" id="generatedPassword" class="form-control text-center" readonly 
                               style="font-size: 1.5rem; font-family: 'Courier New', Courier, monospace; height: 4rem; border-radius: 10px 0 0 10px;"
                               placeholder="Click generate button below">
                        <button id="copyBtn" class="btn btn-outline-secondary px-4" type="button" title="Copy to clipboard" style="border-radius: 0 10px 10px 0;">
                            <i class="fa fa-copy"></i>
                        </button>
                    </div>
                </div>
                <div class="text-center">
                    <button id="generateBtn" class="btn btn-primary btn-lg w-100" style="border-radius: 10px;">Generate Password</button>
                </div>
            </div>
            <div id="copyAlert" class="alert alert-success mt-3 text-center d-none" role="alert">
                Password copied to clipboard!
            </div>
        </div>
    </div>
</div>

<script>
    const adjectives = [
        "swift", "brave", "quiet", "bright", "cool", "smart", "fast", "happy", "blue", "green",
        "strong", "kind", "wild", "calm", "vibrant", "bold", "sharp", "pure", "wise", "grand",
        "gentle", "fierce", "mighty", "jolly", "loyal", "noble", "proud", "quick", "rare", "silent"
    ];
    const nouns = [
        "Tiger", "Eagle", "Mountain", "River", "Forest", "Ocean", "Star", "Wolf", "Lion", "Fox",
        "Bear", "Hawk", "Storm", "Peak", "Flame", "Stone", "Cloud", "Wave", "Night", "Sun",
        "Breeze", "Canyon", "Desert", "Glacier", "Island", "Jungle", "Lake", "Meadow", "Pond", "Valley"
    ];
    const replacements = {
        'a': '@',
        'i': '!',
        's': '$',
        'e': '#',
        'o': '*',
        'l': '|'
    };

    function generatePassword() {
        let adj = adjectives[Math.floor(Math.random() * adjectives.length)];
        const noun = nouns[Math.floor(Math.random() * nouns.length)];
        const num = Math.floor(Math.random() * (99 - 11 + 1)) + 11;
        
        // Ensure Noun starts with capital
        const capitalizedNoun = noun.charAt(0).toUpperCase() + noun.slice(1);
        
        let password = adj + capitalizedNoun + num;
        
        // Find all characters that can be replaced
        let replaceableIndices = [];
        for (let i = 0; i < password.length; i++) {
            if (replacements[password[i].toLowerCase()]) {
                replaceableIndices.push(i);
            }
        }
        
        if (replaceableIndices.length > 0) {
            const randomIndex = replaceableIndices[Math.floor(Math.random() * replaceableIndices.length)];
            
            // If the special character replaces the first letter of the noun,
            // the adjective should be made capital instead.
            if (randomIndex === adj.length) {
                adj = adj.charAt(0).toUpperCase() + adj.slice(1);
                // Reconstruct password with capitalized adjective
                password = adj + capitalizedNoun + num;
            }

            const charToReplace = password[randomIndex].toLowerCase();
            const replacement = replacements[charToReplace];
            
            password = password.substring(0, randomIndex) + replacement + password.substring(randomIndex + 1);
        }
        
        document.getElementById('generatedPassword').value = password;
        // Reset copy alert if shown
        document.getElementById('copyAlert').classList.add('d-none');
    }

    document.getElementById('generateBtn').addEventListener('click', generatePassword);
    
    document.getElementById('copyBtn').addEventListener('click', function() {
        const copyText = document.getElementById("generatedPassword");
        if (copyText.value) {
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value).then(() => {
                const alert = document.getElementById('copyAlert');
                alert.classList.remove('d-none');
                setTimeout(() => {
                    alert.classList.add('d-none');
                }, 3000);
            });
        }
    });
</script>
{% endblock %}
